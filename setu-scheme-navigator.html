<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setu — AI Scheme Navigator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --paper:#FAF7F1;
  --paper-alt:#F1EBDD;
  --card:#FFFFFF;
  --ink:#1C2541;
  --ink-soft:#5B6280;
  --ink-faint:#9198B0;
  --saffron:#E08D3C;
  --saffron-soft:#FBE9D2;
  --green:#2D6A4F;
  --green-soft:#E1EDE6;
  --red:#9C3B3B;
  --red-soft:#F5E5E2;
  --chakra:#1D4E89;
  --chakra-soft:#E1EAF3;
  --border:#E2D9C7;
  --radius:14px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Work Sans',-apple-system,sans-serif;
  min-height:100vh;
}
.mono{font-family:'IBM Plex Mono',monospace;}
.display{font-family:'Fraunces',serif;}

/* ---------- Header ---------- */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;
  border-bottom:1px solid var(--border);
  background:var(--paper);
  position:sticky;top:0;z-index:10;
  flex-wrap:wrap;gap:12px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand svg{width:38px;height:38px;flex-shrink:0;}
.brand-text .name{font-family:'Fraunces',serif;font-weight:700;font-size:24px;letter-spacing:.2px;line-height:1;}
.brand-text .tag{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
.langs{display:flex;gap:6px;background:var(--paper-alt);padding:4px;border-radius:999px;border:1px solid var(--border);}
.lang-btn{
  border:none;background:transparent;padding:7px 14px;border-radius:999px;
  font-family:'Work Sans';font-weight:600;font-size:13px;color:var(--ink-soft);cursor:pointer;
  transition:.2s;
}
.lang-btn.active{background:var(--ink);color:var(--paper);}

/* ---------- Layout ---------- */
main{
  display:grid;
  grid-template-columns:1.6fr 1fr;
  gap:0;
  max-width:1240px;margin:0 auto;
  min-height:calc(100vh - 82px);
}
@media(max-width:880px){
  main{grid-template-columns:1fr;}
  .side{order:2;border-left:none !important;border-top:1px solid var(--border);}
}

/* ---------- Chat panel ---------- */
.chat-panel{
  display:flex;flex-direction:column;
  border-right:1px solid var(--border);
  min-height:calc(100vh - 82px);
}
.chat-scroll{
  flex:1;overflow-y:auto;
  padding:24px 26px 10px;
  display:flex;flex-direction:column;gap:18px;
}
.msg-row{display:flex;gap:10px;max-width:100%;}
.msg-row.user{justify-content:flex-end;}
.bubble{
  padding:13px 16px;border-radius:16px;
  font-size:15px;line-height:1.55;
  max-width:78%;
}
.msg-row.user .bubble{
  background:var(--ink);color:var(--paper);
  border-bottom-right-radius:4px;
}
.msg-row.bot .bubble{
  background:var(--card);border:1px solid var(--border);
  border-bottom-left-radius:4px;
  max-width:100%;
}
.avatar{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--saffron-soft);border:1px solid var(--saffron);
}
.avatar svg{width:16px;height:16px;}

/* pipeline animation */
.pipeline{
  display:flex;align-items:center;gap:0;margin:2px 0 14px 40px;
  max-width:520px;
}
.pl-node{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
.pl-dot{
  width:20px;height:20px;border-radius:50%;
  background:var(--paper-alt);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  transition:.35s;z-index:2;
}
.pl-dot.on{background:var(--chakra);border-color:var(--chakra);}
.pl-dot svg{width:10px;height:10px;opacity:0;transition:.25s;}
.pl-dot.on svg{opacity:1;}
.pl-line{
  position:absolute;top:9px;left:50%;width:100%;height:2px;
  background:var(--border);z-index:1;
}
.pl-line.on{background:var(--chakra);}
.pl-node:last-child .pl-line{display:none;}
.pl-label{font-size:10px;color:var(--ink-faint);margin-top:6px;text-align:center;line-height:1.2;max-width:80px;}
.pl-label.on{color:var(--chakra);font-weight:600;}

/* profile chips inside a bot message */
.profile-strip{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
.chip{
  font-size:12px;padding:5px 10px;border-radius:999px;
  background:var(--chakra-soft);color:var(--chakra);font-weight:600;
  display:inline-flex;align-items:center;gap:4px;
}

/* scheme cards */
.scheme-card{
  border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;margin-top:12px;background:var(--card);
}
.scheme-card.eligible{border-left:4px solid var(--green);}
.scheme-card.ineligible{border-left:4px solid var(--red);opacity:.92;}
.scheme-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.scheme-name{font-family:'Fraunces';font-weight:600;font-size:17px;}
.status-tag{
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;
}
.status-tag.eligible{background:var(--green-soft);color:var(--green);}
.status-tag.ineligible{background:var(--red-soft);color:var(--red);}
.scheme-benefit{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}
.reasons{margin:10px 0 0;padding-left:18px;font-size:13.5px;line-height:1.6;color:var(--ink);}
.reasons li{margin-bottom:2px;}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.meta-pill{
  font-size:11.5px;background:var(--paper-alt);border:1px solid var(--border);
  padding:4px 9px;border-radius:8px;color:var(--ink-soft);
}
.citation{
  margin-top:10px;font-size:11px;color:var(--ink-faint);
  display:flex;align-items:center;gap:5px;
}
.steps-toggle{
  margin-top:10px;font-size:12.5px;font-weight:600;color:var(--chakra);
  cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px;
}
.steps-list{display:none;margin-top:8px;padding-left:18px;font-size:13px;color:var(--ink-soft);line-height:1.7;}
.steps-list.open{display:block;}

/* input area */
.composer{
  border-top:1px solid var(--border);padding:14px 20px;
  display:flex;gap:10px;background:var(--paper);
}
.composer input{
  flex:1;border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;font-size:14.5px;font-family:'Work Sans';background:var(--card);
  color:var(--ink);
}
.composer input:focus{outline:2px solid var(--chakra);outline-offset:1px;}
.composer input:disabled{opacity:.6;cursor:not-allowed;}
.send-btn{
  background:var(--ink);color:var(--paper);border:none;border-radius:12px;
  padding:0 20px;font-weight:600;font-size:14px;cursor:pointer;
  display:flex;align-items:center;gap:6px;
  transition:background .2s, opacity .2s;
}
.send-btn:hover:not(:disabled){background:var(--chakra);}
.send-btn:disabled{opacity:.5;cursor:not-allowed;}
.mic-btn{
  background:var(--card);color:var(--ink-soft);border:1px solid var(--border);border-radius:12px;
  width:44px;flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s, color .2s, opacity .2s;
}
.mic-btn:hover:not(:disabled){border-color:var(--chakra);color:var(--chakra);}
.mic-btn:disabled{opacity:.5;cursor:not-allowed;}
.mic-btn.recording{background:var(--red);color:#fff;border-color:var(--red);animation:mic-pulse 1.2s ease-in-out infinite;}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(156,59,59,.4);}50%{box-shadow:0 0 0 8px rgba(156,59,59,0);}}
.audio-replay{
  display:inline-flex;align-items:center;gap:6px;margin-top:8px;
  background:none;border:1px solid var(--border);border-radius:8px;
  padding:4px 10px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;
}
.audio-replay:hover{border-color:var(--chakra);color:var(--chakra);}

.chips-row{padding:10px 20px 4px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--border);}
.example-chip{
  font-size:12.5px;background:var(--card);border:1px solid var(--border);
  padding:7px 12px;border-radius:10px;cursor:pointer;color:var(--ink-soft);
  transition:.15s;max-width:340px;
}
.example-chip:hover{border-color:var(--chakra);color:var(--chakra);}

/* ---------- Thinking indicator ---------- */
.thinking-dots{
  display:inline-flex;align-items:center;gap:4px;padding:4px 0;
}
.thinking-dots span{
  width:7px;height:7px;border-radius:50%;background:var(--chakra);
  animation:dotPulse 1.4s ease-in-out infinite;
}
.thinking-dots span:nth-child(2){animation-delay:.2s;}
.thinking-dots span:nth-child(3){animation-delay:.4s;}
@keyframes dotPulse{
  0%,80%,100%{opacity:.3;transform:scale(.8);}
  40%{opacity:1;transform:scale(1.1);}
}

/* ---------- Error message ---------- */
.error-bubble{
  background:var(--red-soft) !important;
  border:1px solid var(--red) !important;
  color:var(--red);
}

/* ---------- Answer text formatting ---------- */
.answer-text{word-wrap:break-word;}
.answer-text p{margin:0 0 10px;}
.answer-text p:last-child{margin-bottom:0;}
.answer-text strong{font-weight:600;}
.answer-text code{background:var(--paper-alt);border-radius:4px;padding:1px 5px;font-family:'IBM Plex Mono',monospace;font-size:0.9em;}
.md-table{border-collapse:collapse;width:100%;margin:0 0 10px;font-size:0.95em;}
.md-table th,.md-table td{border:1px solid var(--border);padding:6px 10px;text-align:left;}
.md-table th{background:var(--paper-alt);font-weight:600;}

/* ---------- Side panel ---------- */
.side{padding:26px 24px;}
.side h3{
  font-family:'Fraunces';font-size:14px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);margin:0 0 12px;font-weight:600;
}
.arch-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;margin-bottom:22px;
}
.arch-step{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);}
.arch-step:last-child{border-bottom:none;}
.arch-num{
  font-family:'IBM Plex Mono';font-size:11px;color:var(--saffron);font-weight:600;
  width:20px;flex-shrink:0;padding-top:1px;
}
.arch-text b{font-size:13.5px;display:block;}
.arch-text span{font-size:12px;color:var(--ink-soft);}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.stat-box .num{font-family:'Fraunces';font-size:26px;font-weight:700;color:var(--chakra);}
.stat-box .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

.corpus-list{display:flex;flex-direction:column;gap:0;}
.corpus-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;
}
.corpus-item:last-child{border-bottom:none;}
.corpus-item .dept{color:var(--ink-soft);font-size:11.5px;}

footer.note{
  font-size:11.5px;color:var(--ink-faint);padding:14px 24px 26px;line-height:1.6;
}
</style>
</head>

/* ============ Backend API config ============ */
const API_BASE = 'http://localhost:8000';

/* ============ rendering helpers ============ */

function svgCheck(){return '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function svgBot(){return '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#1C2541" stroke-width="1.6"/><circle cx="9" cy="11" r="1.3" fill="#1C2541"/><circle cx="15" cy="11" r="1.3" fill="#1C2541"/><path d="M9 15c1 1 5 1 6 0" stroke="#1C2541" stroke-width="1.4" stroke-linecap="round"/></svg>';}

function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

/* ============ minimal markdown renderer (no external libs) ============ */
// Escapes first, then applies our own trusted markup on top — never lets
// model output inject raw HTML, only the small set of tags we add ourselves.
function inlineMd(raw){
  let s = escapeHtml(raw);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/(^|[^*])\*(?!\*)([^*]+?)\*(?!\*)/g, '$1<em>$2</em>');
  return s;
}

const TABLE_SEPARATOR_RE = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;

function renderMarkdown(text){
  const lines = text.split('\n');
  let html = '';
  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    if(line.includes('|') && lines[i+1] && TABLE_SEPARATOR_RE.test(lines[i+1])){
      const headerCells = line.split('|').map(c=>c.trim()).filter(c=>c.length);
      html += '<table class="md-table"><thead><tr>' +
        headerCells.map(c=>`<th>${inlineMd(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while(i < lines.length && lines[i].includes('|')){
        const rowCells = lines[i].split('|').map(c=>c.trim()).filter(c=>c.length);
        html += '<tr>' + rowCells.map(c=>`<td>${inlineMd(c)}</td>`).join('') + '</tr>';
        i++;
      }
      html += '</tbody></table>';
      continue;
    }
    if(line.trim() !== ''){
      html += `<p>${inlineMd(line)}</p>`;
    }
    i++;
  }
  return html;
}

function addUserMsg(text){
  const row = document.createElement('div');
  row.className='msg-row user';
  row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  chatScroll.appendChild(row);
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function addBotWelcome(){
  const row = document.createElement('div');

function addBotMessage(text, audioBlob){
  const row = document.createElement('div');
  row.className='msg-row bot';
  row.innerHTML = `<div class="avatar">${svgBot()}</div><div class="bubble"><div class="answer-text">${renderMarkdown(text)}</div></div>`;
  chatScroll.appendChild(row);
  chatScroll.scrollTop = chatScroll.scrollHeight;

  if(audioBlob){

    const audioEl = new Audio(audioUrl);

    const replayBtn = document.createElement('button');

    replayBtn.innerHTML = '&#9658; Play answer';
    replayBtn.onclick = () => audioEl.play();
    bubble.appendChild(replayBtn);
    audioEl.play().catch(()=>{}); // autoplay can be blocked by the browser; replay button still works
  }
}

function addThinkingIndicator(){

function addErrorMessage(msg){
  const row = document.createElement('div');
  row.className='msg-row bot';
  row.innerHTML = `<div class="avatar">${svgBot()}</div><div class="bubble error-bubble">${escapeHtml(msg)}</div>`;
  chatScroll.appendChild(row);
  chatScroll.scrollTop = chatScroll.scrollHeight;

/* ============ pipeline animation ============ */
async function runPipeline(query){
  const t = T[currentLang];
  const stageNames = t.archSteps.map(s=>s[0]);
  const pipelineId = 'pl'+Date.now();
  const pipeHtml = `<div class="pipeline" id="${pipelineId}">` + stageNames.map((label,i)=>`
    <div class="pl-node">
      <div class="pl-dot" data-i="${i}">${svgCheck()}<div class="pl-line"></div></div>
      <div class="pl-label" data-i="${i}">${label}</div>
    </div>`).join('') + `</div>`;

  const wrapper = document.createElement('div');
  wrapper.innerHTML = pipeHtml;
  chatScroll.appendChild(wrapper.firstElementChild);
  chatScroll.scrollTop = chatScroll.scrollHeight;

  const pipeEl = document.getElementById(pipelineId);
  for(let i=0;i<stageNames.length;i++){
    await new Promise(r=>setTimeout(r,320));
    pipeEl.querySelector(`.pl-dot[data-i="${i}"]`).classList.add('on');
    pipeEl.querySelector(`.pl-label[data-i="${i}"]`).classList.add('on');
    const line = pipeEl.querySelector(`.pl-dot[data-i="${i}"] .pl-line`);
    if(line) line.classList.add('on');
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }
  await new Promise(r=>setTimeout(r,150));
}

/* ============ UI state management ============ */
function setProcessing(active){
  isProcessing = active;
  queryInput.disabled = active;
  sendBtn.disabled = active;
}

/* ============ core: ask the backend ============ */
async function askBackend(question){
  const response = await fetch(`${API_BASE}/ask`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ question })
  });

  if(!response.ok){
    throw new Error(`Server responded with ${response.status}`);
  }

  const data = await response.json();
  return data.answer;
}

async function transcribeAudio(blob){
  const form = new FormData();
  form.append('audio', blob, 'query.webm');
  const response = await fetch(`${API_BASE}/transcribe`, { method: 'POST', body: form });
  if(!response.ok){
    throw new Error(`Transcription failed: ${response.status}`);
  }
  const data = await response.json();
  return data.text;
}

async function speakText(text){
  if(!text || !text.trim()){
    console.warn('Setu: skipping /speak — answer text was empty.');
    return null;
  }
  const response = await fetch(`${API_BASE}/speak`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ text })
  });
  if(!response.ok){
    console.warn('Setu: /speak failed', response.status, await response.text().catch(()=>''));
    return null; // voice reply is a bonus, not essential — fail silently
  }
  return response.blob();
}

/* ============ main query handler ============ */
async function handleQuery(query, opts={}){
  if(isProcessing) return;

  const t = T[currentLang];
  addUserMsg(query);
  queryInput.value = '';
  setProcessing(true);

  // Show thinking indicator
  const thinkingEl = addThinkingIndicator();

  try {
    // Run pipeline animation and API call concurrently
    const [_, answer] = await Promise.all([
      runPipeline(query),
      askBackend(query)
    ]);

    // Remove thinking indicator, show the real answer
    removeThinkingIndicator();

    if(!answer || !answer.trim()){
      // The backend returned 200 with no usable content (seen with Groq
      // occasionally) — show something rather than a silent blank bubble.
      addErrorMessage(t.errorGeneric);
    } else {
      // Only synthesize speech when the question itself came in by voice —
      // typed questions get a text-only reply so audio doesn't play unexpectedly.
      const audioBlob = opts.viaVoice ? await speakText(answer) : null;
      addBotMessage(answer, audioBlob);
    }

  } catch(err) {
    removeThinkingIndicator();

    // Determine error type
    if(err instanceof TypeError && err.message.includes('fetch')){
      // Network error — backend unreachable
      addErrorMessage(t.errorOffline);
    } else {
      addErrorMessage(t.errorGeneric);
    }
    console.error('Setu API error:', err);
  } finally {
    setProcessing(false);
    queryInput.focus();
  }
}

/* ============ side panel render ============ */
function renderSide(){
  const t = T[currentLang];
  document.getElementById('archTitle').textContent = t.archTitle;
  document.getElementById('statSchemes').textContent = t.statSchemes;
  document.getElementById('statLangs').textContent = t.statLangs;
  document.getElementById('corpusTitle').textContent = t.corpusTitle;

  document.getElementById('archCard').innerHTML = t.archSteps.map((s,i)=>`
    <div class="arch-step">
      <div class="arch-num">0${i+1}</div>
      <div class="arch-text"><b>${s[0]}</b><span>${s[1]}</span></div>
    </div>`).join('');

  document.getElementById('corpusList').innerHTML = t.corpus.map(c=>`
    <div class="corpus-item"><span>${c[0]}</span><span class="dept">${c[1]}</span></div>`).join('');
}

/* ============ chips + composer ============ */
function renderChips(){
  const t = T[currentLang];
  document.getElementById('chipsRow').innerHTML = t.chips.map(c=>`<div class="example-chip" onclick="handleQuery(${JSON.stringify(c)})">${c}</div>`).join('');
}

function applyLang(lang){
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  const t = T[lang];
  document.getElementById('tagline').textContent = t.tagline;
  document.getElementById('sendLabel').textContent = t.sendLabel;
  document.getElementById('queryInput').placeholder = t.placeholder;
  document.getElementById('disclaimer').textContent = t.disclaimer;
  renderSide();
  renderChips();
}

document.getElementById('langSwitch').addEventListener('click', (e)=>{
  const btn = e.target.closest('.lang-btn');
  if(!btn) return;
  applyLang(btn.dataset.lang);
});

document.getElementById('sendBtn').addEventListener('click', ()=>{
  const val = queryInput.value.trim();
  if(val && !isProcessing) handleQuery(val);
});
document.getElementById('queryInput').addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){
    const val = e.target.value.trim();
    if(val && !isProcessing) handleQuery(val);
  }
});

/* ============ voice input (mic) ============ */
const micBtn = document.getElementById('micBtn');
let mediaRecorder = null;
let isRecording = false;

async function startRecording(){
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const chunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    stream.getTracks().forEach(track => track.stop()); // release the mic indicator
    const blob = new Blob(chunks, { type: mediaRecorder.mimeType });
    handleVoiceQuery(blob);
  };
  mediaRecorder.start();
  isRecording = true;
  micBtn.classList.add('recording');
}

function stopRecording(){
  if(mediaRecorder && isRecording){
    mediaRecorder.stop();
    isRecording = false;
    micBtn.classList.remove('recording');
  }
}

async function handleVoiceQuery(blob){
  micBtn.disabled = true;
  try {
    const text = await transcribeAudio(blob);
    if(text && text.trim()){
      await handleQuery(text, { viaVoice: true });
    } else {
      addErrorMessage(T[currentLang].errorGeneric);
    }
  } catch(err) {
    addErrorMessage(T[currentLang].errorOffline);
    console.error('Setu transcription error:', err);
  } finally {
    micBtn.disabled = false;
  }
}

micBtn.addEventListener('click', () => {
  if(isRecording){
    stopRecording();
    return;
  }
  if(isProcessing) return;
  startRecording().catch(err => {
    console.error('Mic access error:', err);
    addErrorMessage('Could not access the microphone. Please check browser permissions.');
  });
});

/* ============ init ============ */
applyLang('en');
addBotWelcome();
